name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  # Turns the flake's `checks` output into one runner per attribute.
  # See https://github.com/nix-community/nix-github-actions
  nix-matrix:
    name: Generate matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - id: set-matrix
        name: Generate Nix matrix
        run: |
          set -Eeu
          matrix="$(nix eval --json '.#githubActions.matrix')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # Each check is a derivation: `vela` builds the workspace and runs cargo test
  # in its check phase, `wasm` cross-builds to wasm32, plus fmt and clippy.
  #
  # The `web` check *is* the browser bundle, so it is uploaded from here as the
  # Pages artifact rather than rebuilt by the publish job: runners share no Nix
  # store, and a second `nix build` of the same derivation on a fresh runner is
  # the whole cross-compilation again, a quarter of an hour, to produce bytes
  # this job already has.
  nix-build:
    name: ${{ matrix.name }} (${{ matrix.system }})
    needs: nix-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.nix-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix build -L '.#${{ matrix.attr }}' --out-link result
      - name: Copy the bundle out of the store
        if: matrix.name == 'web'
        # The store path is read-only and the upload action needs to walk a
        # normal directory, so dereference the symlink and drop the permissions.
        run: |
          set -Eeu
          cp -rL result site
          chmod -R u+w site
      - uses: actions/upload-pages-artifact@v4
        if: matrix.name == 'web'
        with:
          path: site

  # Publishes the browser bundle, which is how anyone is meant to see this
  # project at all. Only from the default branch: a preview per pull request
  # would need one deployment environment per branch and this is a physics
  # engine, not a web product. Deploys the artifact the `web` check uploaded;
  # builds nothing.
  pages:
    name: Publish the simulator
    needs: nix-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      # Wider than the workflow default above, and only for this job.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
